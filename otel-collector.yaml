receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
  # Serves received metrics at :8889/metrics for Prometheus to scrape.
  prometheus:
    endpoint: 0.0.0.0:8889
    # OpenMetrics adds _created timestamps so Prometheus counts a new series' first request.
    enable_open_metrics: true
  # Loki ingests OTLP natively at /otlp; service.name becomes the service_name label.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
