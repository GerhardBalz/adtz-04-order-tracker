apiVersion: 1

groups:
  - orgId: 1
    name: order-tracker
    folder: Order Tracker
    interval: 1m
    rules:
      - uid: order-tracker-5xx
        title: Order Tracker 5xx responses
        condition: B
        data:
          # 5xx responses per endpoint over the last 5 minutes. A 5xx series exists only
          # after the first 5xx, so a quiet period returns no series (see noDataState).
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                sum by (http_request_method, http_route) (
                  increase(http_server_request_duration_seconds_count{exported_job="order-tracker", http_response_status_code=~"5.."}[5m])
                )
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        # No 5xx series means no 5xx responses, so that is healthy, not an incident.
        noDataState: OK
        # A failing Prometheus query raises a separate DatasourceError alert.
        execErrState: Error
        for: 0s
        annotations:
          summary: '5xx responses on {{ index .Labels "http_request_method" }} {{ index .Labels "http_route" }}'
          description: '{{ printf "%.0f" (index .Values "A").Value }} 5xx responses on {{ index .Labels "http_request_method" }} {{ index .Labels "http_route" }} in the last 5 minutes (evaluated every 1m).'
          dashboard_url: '{{ externalURL }}d/order-tracker/order-tracker?viewPanel=2'
          __dashboardUid__: order-tracker
          __panelId__: "2"
        labels:
          service: order-tracker
          severity: critical
        isPaused: false
